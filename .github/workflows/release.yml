name: Build and release

# Every push to main builds Cabinet.exe and publishes it as the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CABINET_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Smoke test
        shell: pwsh
        run: |
          $v = & .\Cabinet-cli.exe --version
          Write-Host "Built version: $v"
          if ("$v" -notmatch [regex]::Escape($env:CABINET_VERSION)) { throw "version mismatch: $v" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never inlined: commit messages contain quotes and must not run as code.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $tag = "v$env:CABINET_VERSION"
          $notes = "Automatic build of $env:GITHUB_SHA`n`n$env:COMMIT_MESSAGE"
          gh release create $tag Cabinet.exe --title "Cabinet $env:CABINET_VERSION" --notes "$notes" --latest
